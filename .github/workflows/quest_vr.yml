name: Quest VR APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [feature/quest-vr]
permissions:
  contents: read
concurrency:
  group: quest-vr-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-godot
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config ninja-build cmake python3 python3-pip nasm gperf libltdl-dev libglib2.0-dev texinfo ccache
          python3 -m pip install --user --upgrade --break-system-packages meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Build standalone Quest APK
        run: ./gradlew assembleNomtlDebug -Pandroid.injected.build.abi=arm64-v8a --build-cache --parallel
      - name: Stage Quest APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile
          candidates = []
          for apk in Path('app/build/outputs/apk').rglob('*.apk'):
              with zipfile.ZipFile(apk) as archive:
                  names = archive.namelist()
                  abis = {name.split('/')[1] for name in names if name.startswith('lib/')}
                  print(apk, sorted(abis))
                  if abis == {'arm64-v8a'} and 'assets/vr.pck' in names:
                      candidates.append(apk)
          assert len(candidates) == 1, f'Expected one Quest APK, found {candidates}'
          Path('quest-apk').mkdir(exist_ok=True)
          shutil.copy2(candidates[0], 'quest-apk/VR-Tachiyomi-Quest3-debug.apk')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Quest-VR-debug-APK
          path: quest-apk/VR-Tachiyomi-Quest3-debug.apk
          if-no-files-found: error
