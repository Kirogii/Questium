name: Quest VR APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main, 'feature/**', 'release/**']
    tags: ['v1.0.*']
permissions:
  contents: read
concurrency:
  group: quest-vr-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-godot
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config ninja-build cmake python3 python3-pip nasm gperf libltdl-dev libglib2.0-dev texinfo ccache
          python3 -m pip install --user --upgrade --break-system-packages meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Verify vector resource limits
        run: python3 .github/scripts/check_vector_paths.py
      - name: Verify reader image processing
        run: ./gradlew :app:testNomtlDebugUnitTest --tests 'eu.kanade.tachiyomi.ui.vr.VrBorderBoundsTest' --tests 'tachiyomi.core.common.util.system.TallPageSplitterTest' -Pandroid.injected.build.abi=arm64-v8a
      - name: Build standalone Quest APK
        env:
          VR_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        run: ./gradlew :app:stageNomtlDebugQuestApk -Pandroid.injected.build.abi=arm64-v8a --build-cache --parallel
      - name: Stage Quest APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile
          candidates = []
          for metadata in Path('build/quest-raw').rglob('output-metadata.json'):
              print(metadata, metadata.read_text())
          for apk in Path('build/quest-raw').rglob('*.apk'):
              with zipfile.ZipFile(apk) as archive:
                  names = archive.namelist()
                  abis = {name.split('/')[1] for name in names if name.startswith('lib/')}
                  print(apk, sorted(abis))
                  if abis == {'arm64-v8a'} and 'assets/vr.pck' in names:
                      assert 'lib/arm64-v8a/libopenxr_loader.so' in names, 'Quest APK is missing the OpenXR loader'
                      assert 'lib/arm64-v8a/libonnxruntime.so' in names, 'Quest APK is missing the real AI upscaling runtime'
                      candidates.append(apk)
          assert len(candidates) == 1, f'Expected one Quest APK, found {candidates}'
          Path('quest-apk').mkdir(exist_ok=True)
          shutil.copy2(candidates[0], 'quest-apk/VR-Tachiyomi-Quest3-debug.apk')
          PY
      - name: Sign trusted builds
        if: github.event_name != 'pull_request'
        env:
          VR_SIGNING_KEYSTORE_BASE64: ${{ secrets.VR_SIGNING_KEYSTORE_BASE64 }}
          VR_SIGNING_STORE_PASSWORD: ${{ secrets.VR_SIGNING_STORE_PASSWORD }}
          VR_SIGNING_KEY_PASSWORD: ${{ secrets.VR_SIGNING_KEY_PASSWORD }}
          VR_SIGNING_KEY_ALIAS: ${{ secrets.VR_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VR_SIGNING_KEYSTORE_BASE64:?Set the VR signing repository secrets}"
          : "${VR_SIGNING_STORE_PASSWORD:?Missing store password}"
          : "${VR_SIGNING_KEY_PASSWORD:?Missing key password}"
          : "${VR_SIGNING_KEY_ALIAS:?Missing key alias}"
          KEYSTORE="$RUNNER_TEMP/vr-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$VR_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$VR_SIGNING_KEY_ALIAS" --ks-pass env:VR_SIGNING_STORE_PASSWORD --key-pass env:VR_SIGNING_KEY_PASSWORD --out quest-apk/VR-Tachiyomi-alpha.apk quest-apk/VR-Tachiyomi-Quest3-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs quest-apk/VR-Tachiyomi-alpha.apk
          rm quest-apk/VR-Tachiyomi-Quest3-debug.apk
          sha256sum quest-apk/VR-Tachiyomi-alpha.apk > quest-apk/SHA256SUMS.txt
      - name: Preserve APK diagnostics if staging fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: APK-staging-diagnostics
          path: |
            build/quest-raw/**
            app/build/outputs/**
            app/build/intermediates/apk/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Quest-VR-APK
          path: quest-apk/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v1.0.')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Quest-VR-APK
          path: quest-apk
      - name: Publish Quest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TITLE="$RELEASE_TAG"
          if [ "$RELEASE_TAG" = "v1.0.0" ]; then RELEASE_TITLE="$RELEASE_TAG - First Release"; fi
          RELEASE_ARGS=(--title "$RELEASE_TITLE" --draft=false --latest --notes-file .github/alpha-release.md)
          if [ "$RELEASE_TAG" = "v1.0.1" ]; then RELEASE_ARGS+=(--prerelease); else RELEASE_ARGS+=(--prerelease=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" quest-apk/* --clobber
            gh release edit "$RELEASE_TAG" "${RELEASE_ARGS[@]}"
          else
            CREATE_ARGS=(--verify-tag --title "$RELEASE_TITLE" --latest --notes-file .github/alpha-release.md)
            if [ "$RELEASE_TAG" = "v1.0.1" ]; then CREATE_ARGS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" quest-apk/* "${CREATE_ARGS[@]}"
          fi
